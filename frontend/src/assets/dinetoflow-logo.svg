<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 620" role="img" aria-labelledby="title desc">
  <title id="title">DineToFlow logo</title>
  <desc id="desc">DineToFlow restaurant technology logo showing the complete flow from QR ordering to menu, cart, payment, kitchen, serving and growth analytics.</desc>

  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB000"/>
      <stop offset="45%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#E53935"/>
    </linearGradient>
    <linearGradient id="orange2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF3D00"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".12"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1800" height="620" rx="36" fill="#fff"/>

  <!-- Wordmark -->
  <g font-family="Inter, Arial, Helvetica, sans-serif" font-weight="800" font-size="260" letter-spacing="-14">
    <text x="95" y="355" fill="#101722">Dine</text>
    <text x="715" y="355" fill="url(#orange)">To</text>
    <text x="1025" y="355" fill="#101722">Flow</text>
  </g>

  <!-- Subtle baseline -->
  <path d="M95 390 H1695" stroke="#EEF1F4" stroke-width="6" stroke-linecap="round"/>

  <!-- Journey ribbon: QR -> Menu -> Cart -> Payment -> Kitchen -> Serve -> Grow -->
  <path d="M140 300
           C210 245 260 245 315 300
           S425 355 490 300
           S610 245 675 300
           S790 355 855 300
           S975 245 1040 300
           S1160 355 1225 300
           S1340 245 1405 300
           S1530 350 1655 275"
        fill="none" stroke="url(#orange)" stroke-width="9" stroke-linecap="round"/>

  <!-- QR icon -->
  <g transform="translate(120 210)" filter="url(#soft)">
    <rect width="105" height="105" rx="20" fill="#fff" stroke="#FF6A00" stroke-width="6"/>
    <rect x="18" y="18" width="25" height="25" rx="3" fill="#101722"/>
    <rect x="62" y="18" width="25" height="25" rx="3" fill="#101722"/>
    <rect x="18" y="62" width="25" height="25" rx="3" fill="#101722"/>
    <rect x="53" y="55" width="10" height="10" fill="#FF6A00"/>
    <rect x="70" y="55" width="17" height="10" fill="#101722"/>
    <rect x="53" y="73" width="10" height="14" fill="#101722"/>
    <rect x="70" y="72" width="17" height="15" fill="#FF6A00"/>
  </g>

  <!-- Menu icon -->
  <g transform="translate(365 215)" filter="url(#soft)">
    <rect width="92" height="112" rx="18" fill="#fff" stroke="#FF7A00" stroke-width="5"/>
    <circle cx="22" cy="25" r="7" fill="#FF6A00"/>
    <path d="M38 25h35" stroke="#101722" stroke-width="7" stroke-linecap="round"/>
    <circle cx="22" cy="52" r="7" fill="#FFB000"/>
    <path d="M38 52h35" stroke="#101722" stroke-width="7" stroke-linecap="round"/>
    <circle cx="22" cy="79" r="7" fill="#E53935"/>
    <path d="M38 79h35" stroke="#101722" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Cart icon -->
  <g transform="translate(595 225)" fill="none" stroke="#101722" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 8h18l10 48h48l10-34H29"/>
    <circle cx="42" cy="78" r="7" fill="#FF6A00" stroke="none"/>
    <circle cx="76" cy="78" r="7" fill="#FF6A00" stroke="none"/>
    <path d="M43 22h31" stroke="#FF6A00"/>
  </g>

  <!-- Payment icon -->
  <g transform="translate(815 220)" filter="url(#soft)">
    <rect width="105" height="76" rx="16" fill="url(#orange2)"/>
    <rect x="14" y="18" width="77" height="12" rx="6" fill="#fff" opacity=".95"/>
    <rect x="14" y="43" width="30" height="9" rx="4.5" fill="#fff" opacity=".9"/>
    <circle cx="79" cy="51" r="15" fill="#fff"/>
    <path d="M72 51l5 5 10-12" fill="none" stroke="#FF6A00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Kitchen icon -->
  <g transform="translate(1050 205)" filter="url(#soft)">
    <path d="M25 60h85" stroke="#101722" stroke-width="9" stroke-linecap="round"/>
    <path d="M37 60V88h61V60" fill="#FF6A00" opacity=".15" stroke="#101722" stroke-width="7"/>
    <path d="M52 38c0-15 20-15 20-30M75 38c0-15 20-15 20-30" fill="none" stroke="#FF6A00" stroke-width="7" stroke-linecap="round"/>
    <path d="M43 60c0-18 12-30 25-30s25 12 25 30" fill="url(#orange)" stroke="#101722" stroke-width="7"/>
  </g>

  <!-- Serving icon -->
  <g transform="translate(1270 205)">
    <path d="M12 78h100" stroke="#101722" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 78c2-36 21-55 32-55s30 19 32 55" fill="none" stroke="#FF6A00" stroke-width="8"/>
    <path d="M37 47h50" stroke="#FFB000" stroke-width="8" stroke-linecap="round"/>
    <path d="M55 20c0-11 9-20 20-20" fill="none" stroke="#101722" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Dining icon -->
  <g transform="translate(1455 205)">
    <circle cx="52" cy="44" r="34" fill="#FFF3E8"/>
    <path d="M20 88h64" stroke="#101722" stroke-width="8" stroke-linecap="round"/>
    <path d="M52 78V52" stroke="#101722" stroke-width="8" stroke-linecap="round"/>
    <path d="M37 52h30" stroke="#FF6A00" stroke-width="8" stroke-linecap="round"/>
    <path d="M52 52c-9-20-20-20-25-7M52 52c9-20 20-20 25-7" fill="none" stroke="#FF6A00" stroke-width="6"/>
  </g>

  <!-- Growth analytics icon -->
  <g transform="translate(1620 195)">
    <path d="M0 105V30" stroke="#101722" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 105h115" stroke="#101722" stroke-width="8" stroke-linecap="round"/>
    <rect x="20" y="70" width="18" height="27" rx="4" fill="#FFB000"/>
    <rect x="48" y="53" width="18" height="44" rx="4" fill="#FF7A00"/>
    <rect x="76" y="33" width="18" height="64" rx="4" fill="#F4511E"/>
    <path d="M22 58l30-18 22 8 28-35" fill="none" stroke="#E53935" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M94 13h15v15" fill="none" stroke="#E53935" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Flow nodes -->
  <g fill="#fff" stroke="url(#orange)" stroke-width="6">
    <circle cx="280" cy="275" r="12"/>
    <circle cx="510" cy="325" r="12"/>
    <circle cx="735" cy="275" r="12"/>
    <circle cx="975" cy="325" r="12"/>
    <circle cx="1190" cy="275" r="12"/>
    <circle cx="1415" cy="325" r="12"/>
  </g>

  <!-- Tagline -->
  <g font-family="Inter, Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="8">
    <text x="315" y="490" fill="#101722">ORDER</text>
    <circle cx="545" cy="478" r="7" fill="#FF6A00"/>
    <text x="590" y="490" fill="#101722">KITCHEN</text>
    <circle cx="900" cy="478" r="7" fill="#FF6A00"/>
    <text x="945" y="490" fill="#101722">SERVE</text>
    <circle cx="1165" cy="478" r="7" fill="#FF6A00"/>
    <text x="1210" y="490" fill="#101722">GROW</text>
  </g>

  <!-- Accent lines -->
  <path d="M120 478h130M1515 478h165" stroke="url(#orange)" stroke-width="5" stroke-linecap="round"/>
</svg>